[package]
name = "landrop-cli"
version = "1.0.2"
edition = "2024"
rust-version = "1.88"
description = "Terminal client for the LANDrop v2 LAN file transfer protocol"
license = "GPL-3.0-or-later"
repository = "https://github.com/M0rt1s0114/OpenLandrop-Cli"
homepage = "https://github.com/M0rt1s0114/OpenLandrop-Cli"
readme = "README.md"
keywords = ["landrop", "file-transfer", "lan", "cli", "p2p"]
categories = ["command-line-utilities", "network-programming"]
authors = ["Mortis0114"]

[[bin]]
name = "landrop-cli"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
blake2 = "0.11.0"
chacha20poly1305 = "0.11.0"
clap = { version = "4.6.7", features = ["derive"] }
ctrlc = "3.5.2"
dialoguer = "0.12.0"
dirs = "7.0.0"
if-addrs = "0.15.0"
indicatif = "0.18.6"
k256 = "0.14.0"
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
socket2 = { version = "0.6.5", features = ["all"] }
x25519-dalek = { version = "3.0.0", features = ["static_secrets", "getrandom"] }

[dev-dependencies]
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }

# Cherry-picked from `pedantic`. The group as a whole is deliberately not
# enabled: it argues about style as much as substance, and the noise would hide
# the lints below, which catch real mistakes.
doc_markdown = "warn"
manual_let_else = "warn"
match_wildcard_for_single_variants = "warn"
semicolon_if_nothing_returned = "warn"
string_add_assign = "warn"
unnested_or_patterns = "warn"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Optimise dependencies in debug builds too. Measured with `selftest --size
# 8388608`: 6.4 MiB/s without this and 13.3 MiB/s with it, against 183 MiB/s in
# release — so the crypto stack at `opt-level = 0` is most of what a debug run
# costs. `"*"` matches dependencies only, so the crates developed here stay
# cheap to rebuild.
[profile.dev.package."*"]
opt-level = 3
